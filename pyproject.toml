[project]
name = "yowayowa-investor"
version = "0.1.0"
description = "API-first investment research workspace with provenance-aware financial data providers."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "cachetools>=5.5,<7",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2,<4",
  "jinja2>=3.1.6,<4",
  "orjson>=3.11,<4",
  "numpy>=2.3,<3",
  "pandas>=2.3,<3",
  "pandas-ta-classic>=0.6,<1",
  "yfinance>=1.0,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
cli = [
  "typer>=0.16,<1",
  "rich>=14,<15",
]
serve = [
  "uvicorn[standard]>=0.35,<1",
]
xbrl = ["arelle-release>=2.37,<3"]
operator-ir = [
  "pdfminer.six>=20240506,<20270101",
]
operator-windows = [
  "xlwings>=0.33,<1",
  "pywin32>=308; platform_system == 'Windows'",
]
operator-browser = [
  "playwright>=1.26,<2",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-httpx>=0.35,<1",
  "pytest-playwright>=0.7,<1",
  "httpx2>=2.7,<3",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pandas-stubs>=2.3.0",
  "types-cachetools>=5.5",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "uvicorn[standard]>=0.35,<1",
  # CI runs `uv sync --extra dev`, so the PDF extraction path must be present
  # under dev as well; otherwise the real-parser tests would silently skip.
  "pdfminer.six>=20240506,<20270101",
]

[project.scripts]
yowayowa = "yowayowa.cli_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yowayowa"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["yowayowa"]

[tool.ruff.lint.per-file-ignores]
"src/yowayowa/web/ux_i18n.py" = ["E501", "RUF001"]
"tests/test_ux_foundations.py" = ["RUF001"]
"tests/test_rakuten_web_read.py" = ["RUF001"]
"tests/test_ir_acquisition.py" = ["RUF001", "RUF002"]
"src/yowayowa/acquisition/ir.py" = ["RUF001", "RUF002"]
# JPX margin ingestion carries the official Japanese CSV headers verbatim
# (銘柄別信用取引残高の全角括弧付き列名) and Japanese docstrings; the fullwidth
# characters are source data, not typos.
"src/yowayowa/jpx_models.py" = ["RUF001", "RUF002"]
"src/yowayowa/providers/jpx_margin.py" = ["RUF001", "RUF002"]
"src/yowayowa/services/jpx_margin.py" = ["RUF001", "RUF002"]
"src/yowayowa/api/jpx_routes.py" = ["RUF001", "RUF002"]
"src/yowayowa/jpx_margin_cli.py" = ["RUF001", "RUF002"]
"tests/test_jpx_margin.py" = ["RUF001", "RUF002"]
# EDINET screening carries the official Japanese descriptions verbatim
# (訂正有価証券報告書 etc. with fullwidth characters); they are source data.
"tests/test_screening_pipeline.py" = ["RUF001", "RUF002"]
"src/yowayowa/services/screening_pipeline.py" = ["RUF001", "RUF002"]
"src/yowayowa/screening_cli.py" = ["RUF001", "RUF002"]
# P5-A LLM research brief/ask: strict-prompt text, section headings and the
# 未取得 marker are Japanese operator-facing strings with fullwidth
# punctuation; they are product content, not typos.
"src/yowayowa/services/research_brief.py" = ["RUF001", "RUF002"]
"src/yowayowa/services/research_ask.py" = ["RUF001", "RUF002"]
"src/yowayowa/research_cli.py" = ["RUF001", "RUF002"]
"tests/test_research_brief.py" = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["pandas_ta_classic", "yfinance"]
ignore_missing_imports = true

[tool.hatch.build]
include = [
  "src/yowayowa/**/*.py",
  "src/yowayowa/web/templates/*.html",
  "src/yowayowa/web/static/*",
]

[tool.vercel]
entrypoint = "app:app"
