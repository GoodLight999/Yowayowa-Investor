[project]
name = "yowayowa-investor"
version = "0.1.0"
description = "API-first investment research workspace with provenance-aware financial data providers."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "cachetools>=5.5,<7",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2,<4",
  "jinja2>=3.1.6,<4",
  "orjson>=3.11,<4",
  "numpy>=2.3,<3",
  "pandas>=2.3,<3",
  "pandas-ta-classic>=0.6,<1",
  "yfinance>=1.0,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
cli = [
  "typer>=0.16,<1",
  "rich>=14,<15",
]
serve = [
  "uvicorn[standard]>=0.35,<1",
]
xbrl = ["arelle-release>=2.37,<3"]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-httpx>=0.35,<1",
  "pytest-playwright>=0.7,<1",
  "httpx2>=2.7,<3",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pandas-stubs>=2.3.0",
  "types-cachetools>=5.5",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
yowayowa = "yowayowa.cli_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yowayowa"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["yowayowa"]

[tool.ruff.lint.per-file-ignores]
"src/yowayowa/web/ux_i18n.py" = ["E501", "RUF001"]
"tests/test_ux_foundations.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["pandas_ta_classic", "yfinance"]
ignore_missing_imports = true

[tool.hatch.build]
include = [
  "src/yowayowa/**/*.py",
  "src/yowayowa/web/templates/*.html",
  "src/yowayowa/web/static/*",
]

[tool.vercel]
entrypoint = "app:app"
